<!-- 宣纸颗粒覆盖层（低透明度，不遮挡文字） -->
<div class="grain-layer" aria-hidden="true"></div>
<div class="paper-wash" aria-hidden="true"></div>

<!-- 顶栏：仅在地图之后出现 -->
<header class="topbar" id="topbar" hidden>

    <a class="brand" href="#/home" data-nav="home">
      <span class="brand-seal">山河</span>
      <span class="brand-text">团队旅游规划台账</span>

  </div>
</header>

    </div>
    <button class="audio-min" id="audioMin" type="button" title="收起 / 展开">—</button>
  </div>
  <div class="audio-body">

      <button class="audio-btn" id="audioPrev" type="button" title="上一首" aria-label="上一首">

      </button>
      <button class="audio-btn play" id="audioPlay" type="button" title="播放 / 暂停" aria-label="播放或暂停">
        <svg class="ic-play" viewBox="0 0 24 24" width="16" height="16"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" width="16" height="16" hidden><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor"/></svg>
      </button>
      <button class="audio-btn" id="audioNext" type="button" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M18 5v14M5 5l9 7-9 7z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="audio-vol">
      <button class="audio-btn tiny" id="audioMute" type="button" title="静音" aria-label="静音">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9c1.4 1.6 1.4 4.4 0 6M19.6 6.6c2.6 3 2.6 7.8 0 10.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>

      <input type="range" id="audioVol" min="0" max="100" value="25" aria-label="音量">
      <span class="audio-pct" id="audioPct">25</span>
    </div>
    <div class="audio-state" id="audioState">未播放 · 点击开始</div>
  </div>
  <audio id="bgm" src="assets/audio/pingfan-zhilu.mp3" loop preload="metadata"></audio>
</section>

<main id="view" class="view" aria-live="polite">
  <div class="boot-splash">
    <div class="boot-seal">山河卷</div>
    <div class="boot-line">正在展开行程台账 · 请稍候</div>
    <div class="boot-bar"><i></i></div>
  </div>
</main>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="printRoot" class="print-root" aria-hidden="true"></div>
